name: PR checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint · typecheck · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qp
          POSTGRES_PASSWORD: qp
          POSTGRES_DB: qavant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qp -d qavant_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # integration tests (incl. the parallel race tests) run against this real Postgres
      TEST_DATABASE_URL: postgres://qp:qp@localhost:5432/qavant_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build # includes `tsc -b`; migration is skipped (no DATABASE_URL here)

  e2e:
    name: Playwright vs Netlify deploy
    needs: static
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # PR → its deploy preview, push to main → production
      BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--qavant-pay.netlify.app', github.event.number) || 'https://qavant-pay.netlify.app' }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - name: Wait until Netlify serves this commit
        run: node scripts/wait-for-deploy.mjs
      - name: Run Playwright
        run: npx playwright test
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
